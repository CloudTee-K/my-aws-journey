name: Project 05 CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "Projects/Project-05-CICD-Github-Actions/**"
      - ".github/workflows/project-05-cicd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "Projects/Project-05-CICD-Github-Actions/**"

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    name: Lint and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Projects/Project-05-CICD-Github-Actions/my-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: Projects/Project-05-CICD-Github-Actions/my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest tests
        run: npm test

  deploy:
    name: Deploy to Amazon S3
    runs-on: ubuntu-latest
    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy application files to S3
        run: |
          aws s3 sync \
            Projects/Project-05-CICD-Github-Actions/my-app \
            s3://${{ vars.S3_BUCKET_NAME }}/my-app \
            --delete \
            --exclude "node_modules/*"